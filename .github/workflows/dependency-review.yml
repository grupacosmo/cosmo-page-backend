name: Dependency Review

on:
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Review changed dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Git Checkout
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high