name: CI/CD

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to deploy (e.g. sha-<commit> or latest). Leave empty to deploy the current commit.'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: cosmopk/cosmo-page-backend

jobs:
  test:
    name: Build, unit tests, integration tests, contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Git Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and run all tests (unit + IT + contracts + coverage)
        run: ./mvnw --no-transfer-progress --batch-mode clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/failsafe-reports

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco

  docker-build-check:
    name: Validate Docker image build
    if: ${{ github.event_name == 'pull_request' }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Git Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-build:
    name: Build and push Docker image
    if: ${{ github.ref == 'refs/heads/master' && (github.event.inputs.tag == '' || github.event.inputs.tag == null) }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Git Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  deploy:
    # Deploys to the k8s cluster (namespace cosmo). The server must have kubectl
    # with access to the cluster (e.g. k3s). Rollback is done by k8s via rollout undo
    # (the previous ReplicaSet is kept), so no OLD_TAG caching is needed.
    name: Deploy to cluster with smoke tests and rollback
    if: ${{ always() && ((github.ref == 'refs/heads/master' && needs.docker-build.result == 'success') || github.event_name == 'workflow_dispatch') }}
    needs: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          port: 22
          command_timeout: 30m
          script: |
            set -euo pipefail

            NEW_TAG="${{ github.event.inputs.tag || format('sha-{0}', github.sha) }}"
            IMAGE="cosmopk/cosmo-page-backend"
            NS="cosmo"
            DEPLOY="backend"
            export KUBECONFIG="${KUBECONFIG:-$HOME/.kube/config}"
            command -v kubectl >/dev/null 2>&1 || { echo "kubectl missing on server"; exit 1; }

            API_KEY=$(grep -E '^API_KEYS=' /cosmo/.env-prod | head -n1 | cut -d= -f2- | tr -d '"' | tr -d "'" | xargs | cut -d, -f1)
            FB_TOKEN=$(grep -E '^FB_TOKEN=' /cosmo/.env-prod | head -n1 | cut -d= -f2- | tr -d '"' | tr -d "'" | xargs)

            echo "Deploying $IMAGE:$NEW_TAG to $NS/$DEPLOY"

            # Refresh both secrets from /cosmo/.env-prod so env changes reach the
            # cluster, and make sure the cluster has a current imagePullSecret
            # for the private repo.
            kubectl -n "$NS" create secret generic cosmo-env \
              --from-env-file=/cosmo/.env-prod \
              --dry-run=client -o yaml | kubectl apply -f -
            kubectl -n "$NS" create secret docker-registry regcred \
              --docker-server=https://index.docker.io/v1/ \
              --docker-username="${{ secrets.DOCKERHUB_USERNAME }}" \
              --docker-password="${{ secrets.DOCKERHUB_TOKEN }}" \
              --dry-run=client -o yaml | kubectl apply -f -

            kubectl -n "$NS" set image "deployment/$DEPLOY" "backend=$IMAGE:$NEW_TAG"

            if kubectl -n "$NS" rollout status "deployment/$DEPLOY" --timeout=300s; then
              echo "Rollout OK"
            else
              echo "Rollout failed, rolling back..."
              kubectl -n "$NS" rollout undo "deployment/$DEPLOY"
              kubectl -n "$NS" rollout status "deployment/$DEPLOY" --timeout=120s || true
              exit 1
            fi

            smoke_failed() {
              echo "Smoke test failed: $1"
              kubectl -n "$NS" logs "deployment/$DEPLOY" --tail=100 || true
              kubectl -n "$NS" rollout undo "deployment/$DEPLOY"
              kubectl -n "$NS" rollout status "deployment/$DEPLOY" --timeout=120s || true
              exit 1
            }

            # Smoke tests via port-forward on the Service (no need to expose ports).
            kubectl -n "$NS" port-forward "svc/backend" 8081:80 >/dev/null 2>&1 &
            PF_PID=$!
            trap 'kill $PF_PID 2>/dev/null || true' EXIT
            sleep 3

            HEALTH=""
            for i in $(seq 1 60); do
              HEALTH=$(curl -s http://localhost:8081/actuator/health || true)
              if echo "$HEALTH" | grep -q '"UP"'; then
                break
              fi
              sleep 2
            done
            echo "Health: $HEALTH"
            echo "$HEALTH" | grep -q '"UP"' || smoke_failed "actuator health is not UP"

            POSTS_STATUS=$(curl -s -o /dev/null -w '%{http_code}' -H "apiKey: $API_KEY" "http://localhost:8081/api/posts?page=0&size=5")
            echo "GET /api/posts status: $POSTS_STATUS"
            [ "$POSTS_STATUS" = "200" ] || smoke_failed "posts endpoint returned $POSTS_STATUS"

            CHALLENGE=$(curl -s "http://localhost:8081/api/facebook/notif?hub.mode=subscribe&hub.challenge=2137&hub.verify_token=$FB_TOKEN")
            echo "Webhook handshake challenge: $CHALLENGE"
            [ "$CHALLENGE" = "2137" ] || smoke_failed "webhook handshake returned $CHALLENGE"

            echo "Deployed $IMAGE:$NEW_TAG to $NS/$DEPLOY"