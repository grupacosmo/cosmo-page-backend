spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/cosmo_backend
    username: postgres
    password: postgres
  jackson:
    defaultPropertyInclusion: non_null
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

images:
  types:
    - png
    - jpg
    - jpeg

facebook:
  emulator:
    enabled: true

env:
  url: http://localhost:8080
  api-keys: local-dev-key
